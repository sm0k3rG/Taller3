services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend1
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_electrica
    restart: on-failure

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend2
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_electrica
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: db_gestor
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: gestor_red_electrica
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_electrica
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin_gestor
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - red_electrica

networks:
  red_electrica:
    driver: bridge

volumes:
  db_data:
