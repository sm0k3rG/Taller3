services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend1
    env_file:
      - ./.env
    environment:
      - DB_HOST=db_gestor
    expose:
      - "${PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_electrica
    restart: on-failure

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend2
    env_file:
      - ./.env
    environment:
      - DB_HOST=db_gestor
    expose:
      - "${PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_electrica
    restart: on-failure

  db:
    image: mysql:8.0
    container_name: db_gestor
    env_file:
      - ./.env
    expose:
      - "${DB_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - red_electrica
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u$$DB_USER -p$$DB_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin_gestor
    restart: always
    env_file:
      - ./.env
    environment:
      - PMA_HOST=db_gestor
      - PMA_PORT=${DB_PORT}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_electrica

networks:
  red_electrica:
    driver: bridge

volumes:
  db_data:
