services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor-red-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      REPLICA_NAME: ${REPLICA_NAME:-Instancia Base}
    networks:
      - red-interna

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: gestor-red-frontend
    restart: unless-stopped
    networks:
      - red-interna
    depends_on:
      - backend

  nginx-proxy:
    image: nginx:alpine
    container_name: gestor-red-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red-interna
    depends_on:
      - frontend
      - backend

networks:
  red-interna:
    driver: bridge
    name: red-interna
