#Aca nosotros definimos cual es la capacidad de procesamiento simultaneo (basicamente son las conexiones al mismo tiempo que soporta)
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #Balanceo de carga: se creara un grupo virtual llamado backend_cluster, aca docker vincula el nombre del dominio interno backend a las ips de ambas replicas, se utiliza round robin
    upstream backend_cluster {
        server backend1:3000;
        server backend2:3000;
        keepalive 0;
    }

    server {
        listen 80;
        server_name localhost;
        #Redirije al frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        #Redirije la peticion al cluster
        location /api/ {
            proxy_pass http://backend_cluster/api/;
            proxy_http_version 1.0;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Served-By $upstream_addr always;
        }
    }
}