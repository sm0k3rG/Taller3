# Fragmento para integrar en docker-compose.yaml del ecosistema completo.
# El proxy inverso global es el ÚNICO servicio que publica puertos (80:80).
# El frontend NO declara "ports:" hacia el host.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Ruta relativa: el navegador llama al mismo host del proxy; este reenvía al backend por nombre de servicio
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: gestor-red-frontend
    restart: unless-stopped
    networks:
      - red-interna
    depends_on:
      - backend
    # Sin sección "ports" — aislamiento de red según requerimiento del taller

  # Ejemplo de proxy inverso global (único que expone 80 al host)
  # nginx-proxy:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - red-interna
  #   depends_on:
  #     - frontend
  #     - backend

networks:
  red-interna:
    driver: bridge
    name: red-interna
