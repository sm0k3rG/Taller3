services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: gestor-red-frontend
    restart: unless-stopped
    networks:
      - red-interna
    depends_on:
      - backend

networks:
  red-interna:
    driver: bridge
    name: red-interna
