# Proxy inverso global del ecosistema (único servicio con ports: "80:80" en Compose).
# Los nombres de host son los service names de Docker Compose (sin IPs estáticas).

server {
    listen 80;
    server_name localhost;

    # Frontend (estáticos Vue)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API del Gestor de Red Eléctrica → servicio "backend"
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
